<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="解圓環">
<meta name="theme-color" content="#bfe3fb">
<title>解圓環</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#6b3f22; --brown:#8a5a2b; --brown-d:#6b3d1c; --cream:#fff4e2; --cream-d:#e8c9a1;
    --fs:16px; --pad:12px; --gap:10px; --btnh:52px; --radius:30px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;font-family:"Huninn","Yuanti TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink)}
  body{overflow:hidden;touch-action:manipulation;overscroll-behavior:none;position:fixed;inset:0;
    background:
      radial-gradient(circle at 8% 85%, #ffc4d8 0%, rgba(255,196,216,0) 38%),
      radial-gradient(circle at 95% 92%, #ffd9b8 0%, rgba(255,217,184,0) 40%),
      radial-gradient(circle at 92% 10%, #c9ecff 0%, rgba(201,236,255,0) 40%),
      linear-gradient(160deg, #bfe6fb 0%, #c6dcfa 45%, #f6cfe4 80%, #ffdcc8 100%);}
  .deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .deco > *{position:absolute}
  .bubble{border-radius:50%;background:radial-gradient(circle at 32% 30%, rgba(255,255,255,.95) 0 12%, rgba(255,255,255,.25) 13% 55%, rgba(180,220,255,.35) 100%);
          border:1.5px solid rgba(255,255,255,.8);animation:float 6s ease-in-out infinite}
  .ringdeco{border-radius:50%;border:26px solid rgba(255,255,255,.18)}
  .twinkle{animation:tw 2.6s ease-in-out infinite}
  @keyframes tw{50%{opacity:.35;transform:scale(.75)}}
  @keyframes float{50%{transform:translateY(-12px)}}
  @keyframes drift{50%{transform:translateX(14px)}}
  .cloud{animation:drift 9s ease-in-out infinite}

  /* ---- 版面：直式 ---- */
  .app{position:relative;z-index:1;
    height:100%; height:100dvh; margin:0 auto; max-width:560px;
    padding: calc(env(safe-area-inset-top) + var(--pad)) calc(env(safe-area-inset-right) + var(--pad))
             calc(env(safe-area-inset-bottom) + var(--pad)) calc(env(safe-area-inset-left) + var(--pad));
    display:grid; gap:var(--gap);
    grid-template-columns:1fr;
    grid-template-rows:auto minmax(0,1fr) auto;
    grid-template-areas:"title" "stage" "controls";
  }
  .title{grid-area:title;display:flex;justify-content:center}
  .title svg{height:84px;width:auto;display:block;overflow:visible}
  .stage{grid-area:stage;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
  .controls{grid-area:controls;display:grid;gap:var(--gap);
    grid-template-columns:var(--btnh) 1.25fr 1fr 1fr;
    grid-template-areas:"sound level hint reset"}
  #soundBtn{grid-area:sound} #levelBtn{grid-area:level} #hintBtn{grid-area:hint} #resetBtn{grid-area:reset}

  /* ---- 按鈕：奶油色卡通風 ---- */
  .btn{position:relative;border:3px solid var(--brown);border-radius:18px;height:var(--btnh);
       background:linear-gradient(180deg,#fffaf1 0%,var(--cream) 60%,#fbe6c8 100%);color:var(--ink);
       font-weight:800;font-size:var(--fs);font-family:inherit;white-space:nowrap;cursor:pointer;
       display:flex;align-items:center;justify-content:center;gap:.35em;padding:0 .6em;
       box-shadow:0 5px 0 var(--brown-d), inset 0 2px 0 rgba(255,255,255,.9);transition:transform .08s}
  .btn::after{content:"";position:absolute;left:10px;right:10px;top:4px;height:30%;border-radius:12px;background:rgba(255,255,255,.55);pointer-events:none}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brown-d), inset 0 2px 0 rgba(255,255,255,.9)}
  .btn .ic{font-size:1.15em;line-height:1}
  .btn.sound{padding:0}
  .btn.level{background:linear-gradient(180deg,#ffe9d4 0%,#ffd7b5 100%)}
  .btn.hint{background:linear-gradient(180deg,#fff27a 0%,#ffd93b 55%,#ffc928 100%);border-color:#b8860b;box-shadow:0 5px 0 #946a06, inset 0 2px 0 rgba(255,255,255,.8)}
  .btn.hint:active{box-shadow:0 1px 0 #946a06}
  .btn.reset{background:linear-gradient(180deg,#f4fbff 0%,#d9efff 100%);border-color:#6b9cc4;color:#3d5f7d;box-shadow:0 5px 0 #4f7ea6, inset 0 2px 0 rgba(255,255,255,.9)}
  .btn.reset:active{box-shadow:0 1px 0 #4f7ea6}
  .lvl-k{font-size:.85em}

  /* ---- 遊戲板：奶油色卡片 + 縫線 ---- */
  .board{position:relative;width:100%;height:100%;border-radius:var(--radius);
         background:radial-gradient(circle at 50% 35%, #fff8ec 0%, #fcefdc 70%, #f8e6cc 100%);
         border:4px solid #d6a676;box-shadow:0 9px 0 #c99366, 0 16px 28px rgba(140,90,60,.25)}
  .board::before{content:"";position:absolute;inset:12px;border:3px dashed #e3bf96;border-radius:calc(var(--radius) - 12px);pointer-events:none}
  .board .paw{position:absolute;width:26px;height:26px;opacity:.55;pointer-events:none}
  svg#game{position:relative;width:100%;height:100%;display:block;touch-action:none}
  svg#game text{font-family:inherit}
  .ring{cursor:pointer}

  /* ---- 手機很窄 ---- */
  @media (max-width:400px){
    :root{--fs:14px; --gap:8px; --btnh:48px}
    .title svg{height:70px}
  }
  /* ---- iPad 直放 ---- */
  @media (min-width:700px) and (min-height:700px){
    :root{--fs:21px; --pad:24px; --gap:16px; --btnh:66px; --radius:40px}
    .app{max-width:820px}
    .title svg{height:120px}
    .btn{border-radius:22px;border-width:3.5px}
    .board::before{inset:16px;border-radius:calc(var(--radius) - 16px)}
  }

  /* ---- 橫式：左邊標題 + 按鈕，右邊遊戲板 ---- */
  @media (orientation:landscape) and (min-width:640px){
    .app{
      max-width:none; justify-content:center;
      grid-template-columns:minmax(240px,380px) minmax(0, calc((100dvh - var(--pad)*2 - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 0.714));
      grid-template-rows:minmax(0,1fr) auto auto minmax(0,1fr);
      grid-template-areas:"sp1 stage" "title stage" "controls stage" "sp2 stage";
      column-gap:calc(var(--gap) * 3.5);
    }
    .title svg{width:100%;height:auto;max-height:180px}
    .controls{margin-top:calc(var(--gap) * 1.5);
      grid-template-columns:var(--btnh) 1fr;
      grid-template-areas:"sound level" "hint hint" "reset reset"}
  }
  @media (orientation:landscape) and (min-width:640px) and (min-height:700px){
    :root{--fs:22px; --pad:28px; --gap:16px; --btnh:70px; --radius:40px}
    .btn{border-radius:22px;border-width:3.5px}
    .board::before{inset:16px;border-radius:calc(var(--radius) - 16px)}
  }
  @media (orientation:landscape) and (max-height:520px){
    :root{--fs:15px; --pad:10px; --gap:8px; --btnh:46px; --radius:24px}
    .app{grid-template-columns:minmax(200px,260px) minmax(0, calc((100dvh - var(--pad)*2 - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 0.714))}
    .title svg{max-height:96px}
    .board::before{inset:8px}
  }

  /* ---- 彈出視窗 ---- */
  .overlay{position:fixed;inset:0;background:rgba(120,80,60,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
           display:none;align-items:center;justify-content:center;z-index:10;
           padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
  .overlay.show{display:flex}
  .panel{position:relative;background:radial-gradient(circle at 50% 30%, #fffaf2, #fcecd6);border:4px solid #d6a676;border-radius:30px;
         padding:24px 20px 22px;text-align:center;width:100%;max-width:380px;max-height:100%;overflow:auto;
         box-shadow:0 9px 0 #c99366, 0 18px 34px rgba(120,70,40,.3);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
  .panel::before{content:"";position:absolute;inset:9px;border:2.5px dashed #e3bf96;border-radius:22px;pointer-events:none}
  @keyframes pop{from{transform:scale(.6);opacity:0}}
  .panel h2{margin:4px 0 8px;font-size:30px;color:var(--brown)}
  .panel p{margin:6px 0 16px;font-weight:700;color:#8b6648;font-size:var(--fs)}
  .panel .row .btn{flex:1;max-width:200px}
  .stars{font-size:46px;letter-spacing:6px;margin:4px 0}
  .stars .off{filter:grayscale(1);opacity:.25}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:10px 0 18px}
  .lv{aspect-ratio:1;border-radius:18px;border:3px solid #6f45b3;font-size:22px;font-weight:900;color:#fff;cursor:pointer;font-family:inherit;
      display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;
      background:linear-gradient(180deg,#c3a2f5,#a877e8);box-shadow:0 4px 0 #6f45b3;text-shadow:0 2px 0 rgba(0,0,0,.2)}
  .lv:nth-child(5n+2){background:linear-gradient(180deg,#8fd0ff,#4fb0f0);border-color:#2a78bd;box-shadow:0 4px 0 #2a78bd}
  .lv:nth-child(5n+3){background:linear-gradient(180deg,#a8e67f,#7fd24f);border-color:#479a26;box-shadow:0 4px 0 #479a26}
  .lv:nth-child(5n+4){background:linear-gradient(180deg,#ffb0d2,#ff82b8);border-color:#cf4f88;box-shadow:0 4px 0 #cf4f88}
  .lv:nth-child(5n+5){background:linear-gradient(180deg,#ffc489,#ff9e45);border-color:#cc6c1c;box-shadow:0 4px 0 #cc6c1c}
  .lv small{font-size:10px;letter-spacing:-1px}
  .lv.locked{background:#e4d7c6 !important;border-color:#b8a48c !important;box-shadow:0 4px 0 #b8a48c !important;cursor:not-allowed}
  .lv.cur{outline:4px solid #ffd54a;outline-offset:2px}
  .row{display:flex;gap:12px;justify-content:center}
  @media (min-width:700px) and (min-height:600px){
    .panel{max-width:540px;padding:36px 32px 32px;border-radius:38px}
    .panel::before{inset:12px;border-radius:28px}
    .panel h2{font-size:42px}
    .stars{font-size:66px}
    .grid{gap:16px}
    .lv{font-size:30px;border-radius:22px}
    .lv small{font-size:13px}
  }
  .confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:20;pointer-events:none;animation:fall linear forwards;border-radius:3px}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="cloud" viewBox="0 0 120 64"><path d="M22 58 C6 58 2 40 16 34 C14 18 34 10 44 20 C50 4 78 4 82 22 C98 16 112 30 104 42 C118 46 112 60 98 58 Z" fill="#fff" stroke="#d6ecfb" stroke-width="3"/><path d="M26 50 C40 54 80 54 96 50" stroke="#e3f2fd" stroke-width="4" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="heart" viewBox="0 0 24 22"><path d="M12 21 C-6 9 3 -4 12 5 C21 -4 30 9 12 21 Z" fill="#ff8fb4" stroke="#e45d8e" stroke-width="1.6"/><ellipse cx="7" cy="7" rx="2.2" ry="1.4" fill="#fff" opacity=".7"/></symbol>

</svg>
<div class="deco" aria-hidden="true">
  <div class="ringdeco" style="width:440px;height:440px;left:-200px;top:22%"></div>
  <div class="ringdeco" style="width:520px;height:520px;right:-240px;bottom:-140px"></div>
  <svg class="cloud" style="left:4%;top:20%;width:130px;height:70px"><use href="#cloud"/></svg>

  <svg class="twinkle" style="right:8%;top:8%;width:30px;height:30px;animation-delay:-1s"><use href="#spark"/></svg>
  <svg class="twinkle" style="left:8%;top:62%;width:34px;height:34px;animation-delay:-1.6s"><use href="#spark"/></svg>
  <svg class="twinkle" style="right:12%;bottom:8%;width:24px;height:24px;animation-delay:-.6s"><use href="#spark"/></svg>
  <svg class="twinkle" style="right:10%;bottom:36%;width:36px;height:36px;animation-delay:-2s"><use href="#star"/></svg>
  <div class="bubble" style="right:12%;top:30%;width:54px;height:54px"></div>
  <div class="bubble" style="right:15%;top:38%;width:22px;height:22px;animation-delay:-2s"></div>
  <div class="bubble" style="left:14%;top:66%;width:60px;height:60px;animation-delay:-1s"></div>
  <div class="bubble" style="left:28%;bottom:2%;width:46px;height:46px;animation-delay:-3s"></div>
  <div class="bubble" style="right:20%;bottom:6%;width:40px;height:40px;animation-delay:-4s"></div>
</div>

<div class="app">
  <div class="title">
    <svg viewBox="0 0 420 170" aria-label="解圓環">
      <defs>
        <linearGradient id="tfill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fffaf0"/><stop offset=".55" stop-color="#ffe3a8"/><stop offset="1" stop-color="#f6b866"/>
        </linearGradient>
        <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9be06a"/><stop offset="1" stop-color="#4fa83a"/></linearGradient>

      <!-- 小芽 -->
      <g transform="translate(210 46)">
        <path d="M0 6 C0 -4 1 -10 0 -16" stroke="#3f8a2c" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M0 -12 C-10 -30 -36 -30 -42 -18 C-30 -6 -10 -6 0 -12 Z" fill="url(#leaf)" stroke="#3f8a2c" stroke-width="3" stroke-linejoin="round"/>
        <path d="M0 -14 C10 -34 38 -34 44 -20 C32 -8 10 -8 0 -14 Z" fill="url(#leaf)" stroke="#3f8a2c" stroke-width="3" stroke-linejoin="round"/>
        <path d="M-6 -16 C-16 -22 -26 -22 -32 -19" stroke="#c9f0a8" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M6 -18 C16 -25 28 -25 34 -21" stroke="#c9f0a8" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
      <g font-family="Huninn, 'Yuanti TC', 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="104" font-weight="900" text-anchor="middle">
        <text x="210" y="150" fill="#6b3d1c" stroke="#6b3d1c" stroke-width="22" stroke-linejoin="round" transform="translate(0 7)">解圓環</text>
        <text x="210" y="150" fill="#8a5a2b" stroke="#7a4a24" stroke-width="18" stroke-linejoin="round">解圓環</text>
        <text x="210" y="150" fill="url(#tfill)" stroke="#fff6e4" stroke-width="4" stroke-linejoin="round" paint-order="stroke">解圓環</text>
      </g>
      <use href="#spark" x="18" y="58" width="26" height="26" fill="#bfe6ff"/>
      <use href="#star" x="356" y="36" width="34" height="34"/>
      <use href="#star" x="388" y="74" width="24" height="24"/>
      <use href="#star" x="340" y="10" width="20" height="20"/>
      <use href="#heart" x="0" y="96" width="20" height="18"/>
    </svg>
  </div>
  <div class="stage" id="stage">
    <div class="board" id="board">
      <svg id="game" viewBox="0 0 400 560" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </div>
  <div class="controls">
    <button class="btn sound" id="soundBtn" title="音效"><span class="ic">🔊</span></button>
    <button class="btn level" id="levelBtn">第 1 / 10 關</button>
    <button class="btn hint" id="hintBtn"><span class="ic">💡</span>提示</button>
    <button class="btn reset" id="resetBtn"><span class="ic">↻</span>重來</button>
  </div>
</div>

<div class="overlay" id="winOv"><div class="panel">
  <h2>🎉 過關！</h2>
  <div class="stars" id="winStars"></div>
  <p id="winText"></p>
  <div class="row"><button class="btn" id="winRetry">↺ 再玩一次</button><button class="btn hint" id="winNext">下一關 ▶</button></div>
</div></div>

<div class="overlay" id="menuOv"><div class="panel">
  <h2>選擇關卡</h2>

</div></div>

  <div class="row"><button class="btn hint" id="endMenu">回到關卡</button></div>
</div></div>

<script>
(() => {
"use strict";
// ---------- 設定 ----------
const GH = 34;        // 缺口半寬（度）
const TOL = 20;       // 卡榫可滑出的容許角度
const STEP = 90;      // 每次旋轉角度
const SW = 19;        // 圓環粗細
let ROT_MS = 300;

const PAL = {           // [主色, 外框, 亮色]
  purple:['#a877e8','#6f45b3','#d9c4fa'],
  blue:  ['#4fb0f0','#2a78bd','#bfe5ff'],
  pink:  ['#ff82b8','#cf4f88','#ffd0e5'],
  green: ['#7fd24f','#479a26','#cdf2b0'],
  dgreen:['#45a35c','#276f3a','#a6dcb3'],
  red:   ['#ff7468','#c9443a','#ffc4bd'],
  orange:['#ff9e45','#cc6c1c','#ffd3a6'],
  navy:  ['#6a86f2','#3a55bf','#c6d2ff'],
  yellow:['#ffd54a','#c99a10','#fff0b0'],
  teal:  ['#42cad6','#1f8f9b','#b8f0f4'],
};

// 關卡設定：n=圓環數，depth=卡住的層數，extra=額外卡榫，ice=冰凍環數，gift=禮物環數
const LEVEL_CFG = [
 { n:8,  depth:1, extra:0, ice:0, gift:0, tip:'點一下<b>沒有鎖</b>的圓環讓它轉動！缺口轉到卡榫的位置，卡榫就會脫落。<br>點圓環<b>右半邊 ↻ 順時針</b>，點<b>左半邊 ↺ 逆時針</b>。' },
 { n:8,  depth:2, extra:0, ice:0, gift:0, tip:'有 🔒 的圓環被卡住了，要先把它的卡榫從別的環上解開才能轉。' },
 { n:8,  depth:2, extra:2, ice:0, gift:0, tip:'有的圓環同時卡在兩個環上，兩個卡榫都要解開喔。' },
 { n:9,  depth:2, extra:1, ice:1, gift:0, tip:'❄️ <b>冰凍環</b>：要先點幾下把冰敲碎，才能轉動！' },
 { n:9,  depth:3, extra:2, ice:1, gift:0, tip:'想一想：先轉哪一個環，可以讓最多的鎖打開？' },
 { n:9,  depth:3, extra:2, ice:1, gift:1, tip:'🎁 <b>禮物環</b>：把它解開，步數 −2，更容易拿到 3 顆星！' },
 { n:9,  depth:3, extra:3, ice:2, gift:1, tip:'冰凍環變多了！先想好順序再動手。' },
 { n:10, depth:3, extra:3, ice:2, gift:1, tip:'10 個圓環來了！一個一個慢慢解。' },
 { n:10, depth:4, extra:3, ice:2, gift:1, tip:'層層卡住！找出最上面的那個環先轉。' },
 { n:10, depth:4, extra:4, ice:3, gift:2, tip:'最終關！所有花樣都在這裡，加油！' },
];
const COLORS = ['purple','blue','pink','green','dgreen','red','orange','navy','yellow','teal'];
const LAYOUTS = {

// ---------- 工具 ----------
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const mod = (a,n) => ((a % n) + n) % n;
const angDist = (a,b) => { const d = mod(a-b,360); return Math.min(d,360-d); };
function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function swept(gFrom, gTo, k){
  if (gTo >= gFrom){ const x = mod(k - gFrom + TOL, 360); return x <= (gTo-gFrom) + 2*TOL; }
  const x = mod(gFrom - k + TOL, 360); return x <= (gFrom-gTo) + 2*TOL;
}
function arcPath(r){
  const a1 = GH*Math.PI/180, a2 = (360-GH)*Math.PI/180;
  return `M ${r*Math.cos(a1)} ${r*Math.sin(a1)} A ${r} ${r} 0 1 1 ${r*Math.cos(a2)} ${r*Math.sin(a2)}`;
}

// ---------- 關卡產生器（固定種子，每次都一樣） ----------
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function segCircleDist(ax, ay, bx, by, cx, cy){
  const dx = bx-ax, dy = by-ay, L = dx*dx+dy*dy;
  let t = L ? ((cx-ax)*dx + (cy-ay)*dy)/L : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(ax+t*dx-cx, ay+t*dy-cy);
}
function segCross(p, q){
  const o = (a,b,c) => Math.sign((b[0]-a[0])*(c[1]-a[1]) - (b[1]-a[1])*(c[0]-a[0]));
  return o(p[0],p[1],q[0]) !== o(p[0],p[1],q[1]) && o(q[0],q[1],p[0]) !== o(q[0],q[1],p[1]);
}
function tryGenerate(cfg, rand){
  const n = cfg.n, rows = LAYOUTS[n][Math.floor(rand()*LAYOUTS[n].length)];
  const r = n === 8 ? 43 : n === 9 ? 40 : 38;
  const gapY = Math.min(150, 415/(rows.length-1));
  const y0 = 280 - gapY*(rows.length-1)/2;
  const rings = [];
  rows.forEach((cnt, ri) => {
    const xs = cnt === 3 ? [75,200,325] : [130,270];
    xs.forEach(x => rings.push({ x: x + (rand()-0.5)*24, y: y0 + ri*gapY + (rand()-0.5)*20, r: r + Math.round((rand()-0.5)*6) }));
  });
  // 不可重疊、不可出界
  for (const A of rings){
    if (A.x-A.r < 10 || A.x+A.r > 390 || A.y-A.r < 10 || A.y+A.r > 550) return null;
    for (const B of rings) if (A !== B && Math.hypot(A.x-B.x, A.y-B.y) - A.r - B.r < 26) return null;
  }
  // 可以連的鄰居
  const near = (i,j) => { const A = rings[i], B = rings[j]; const st = Math.hypot(A.x-B.x, A.y-B.y) - A.r - B.r;
    if (st < 30 || st > 76) return false;
    for (let k = 0; k < n; k++){ if (k===i || k===j) continue; const C = rings[k];
      if (segCircleDist(A.x, A.y, B.x, B.y, C.x, C.y) < C.r + 12) return false; }
    return true; };
  // 分層
  const D = cfg.depth, layer = rings.map(() => Math.floor(rand()*(D+1)));
  for (let l = 0; l <= D; l++) if (!layer.includes(l)) layer[Math.floor(rand()*n)] = l;
  for (let l = 0; l <= D; l++) if (!layer.includes(l)) return null;
  const links = [], has = (o,h) => links.some(L => L[0]===o && L[1]===h);
  const owned = i => links.filter(L => L[0]===i).length, hosted = i => links.filter(L => L[1]===i).length;
  const order = rings.map((_,i) => i).sort((a,b) => layer[a]-layer[b]);
  for (const i of order){
    if (layer[i] === 0) continue;
    let c = rings.map((_,j) => j).filter(j => layer[j] === layer[i]-1 && near(i,j) && hosted(j) < 3);
    if (!c.length) c = rings.map((_,j) => j).filter(j => layer[j] < layer[i] && near(i,j) && hosted(j) < 3);
    if (!c.length) return null;
    links.push([i, c[Math.floor(rand()*c.length)]]);
  }
  // 第 0 層的環一定要卡著別人
  for (let i = 0; i < n; i++){
    if (layer[i] !== 0 || hosted(i)) continue;
    const c = rings.map((_,j) => j).filter(j => layer[j] > 0 && near(j,i) && owned(j) < 2);
    if (!c.length) return null;
    links.push([c[Math.floor(rand()*c.length)], i]);
  }
  let extra = cfg.extra, guard = 0;
  while (extra > 0 && guard++ < 200){
    const i = Math.floor(rand()*n), j = Math.floor(rand()*n);
    if (layer[i] > layer[j] && !has(i,j) && near(i,j) && owned(i) < 2 && hosted(j) < 3){ links.push([i,j]); extra--; }
  }
  if (extra > 0) return null;
  // 實際層數要夠深
  const memo = {}; const dep = i => memo[i] ?? (memo[i] = Math.max(0, ...links.filter(L => L[0]===i).map(L => 1 + dep(L[1]))));
  if (Math.max(...rings.map((_,i) => dep(i))) < D) return null;
  // 支架不可交叉
  const seg = L => { const A = rings[L[0]], B = rings[L[1]]; return [[A.x,A.y],[B.x,B.y]]; };
  for (let a = 0; a < links.length; a++) for (let b = a+1; b < links.length; b++){
    const p = links[a], q = links[b];
    if (p[0]===q[0] || p[0]===q[1] || p[1]===q[0] || p[1]===q[1]) continue;
    if (segCross(seg(p), seg(q))) return null;
  }
  // 每個環上的卡榫/支架角度要分得開，缺口才有地方放
  for (let i = 0; i < n; i++){
    const angs = links.filter(L => L[0]===i || L[1]===i).map(L => { const o = L[0]===i ? L[1] : L[0];
      return Math.atan2(rings[o].y-rings[i].y, rings[o].x-rings[i].x)*180/Math.PI; });
    for (let a = 0; a < angs.length; a++) for (let b = a+1; b < angs.length; b++) if (angDist(angs[a], angs[b]) < 38) return null;
    let best = 0; for (let g = 0; g < 360; g += 5) best = Math.max(best, Math.min(...angs.map(x => angDist(g,x))));
    if (best < 45) return null;
  }
  // 冰凍、禮物：放在需要轉動的環（有卡著別人的）
  const turners = rings.map((_,i) => i).filter(i => hosted(i) > 0);
  const pick = (arr, k) => { const a = arr.slice(), out = []; while (out.length < k && a.length) out.push(a.splice(Math.floor(rand()*a.length),1)[0]); return out; };
  const ice = pick(turners, cfg.ice);
  if (ice.length < cfg.ice) return null;
  const gift = pick(rings.map((_,i) => i).filter(i => !ice.includes(i)), cfg.gift);
  const cols = pick(COLORS, n);
  return { tip: cfg.tip,
    rings: rings.map((R,i) => [Math.round(R.x), Math.round(R.y), R.r, cols[i],
      { ice: ice.includes(i) ? 1 + Math.floor(rand()*2) : 0, gift: gift.includes(i) }]),
    links };
}
function makeLevel(i){
  const cfg = LEVEL_CFG[i];
  for (let a = 0; a < 60000; a++){ const L = tryGenerate(cfg, rng(7919*(i+1) + a)); if (L) return L; }
  throw new Error('level gen failed ' + i);
}
const LEVELS = LEVEL_CFG.map((_, i) => makeLevel(i));

function tone(f, d=0.12, type='sine', vol=0.15, delay=0, slide=0){

function costOfRing(ring, links){
  const ks = links.filter(l => !l.released && l.host === ring.id).map(l => l.angle);
  return ring.ice + planRotation(ring.g, ks).length;
}
// BFS：找出最少的旋轉步數，讓缺口掃過所有卡榫
function planRotation(g0, ks){
  if (!ks.length) return [];
  const full = (1<<ks.length) - 1;
  const seen = new Set(['0|0']); let q = [[0,0,[]]];
  while (q.length){
    const nq = [];
    for (const [s,m,path] of q){
      for (const d of [1,-1]){
        const ns = s+d; if (Math.abs(ns) > 4) continue;
        let nm = m;
        ks.forEach((k,i) => { if (swept(g0+s*STEP, g0+ns*STEP, k)) nm |= 1<<i; });
        const np = path.concat(d);
        if (nm === full) return np;
        const key = ns+'|'+nm; if (seen.has(key)) continue;
        seen.add(key); nq.push([ns,nm,np]);
      }
    }
    q = nq;
  }
  return [1,1,1,1];
}

function loadLevel(idx){
  closeAll();
  const L = LEVELS[idx];
  const rings = L.rings.map((a,i) => ({ id:i, x:a[0], y:a[1], r:a[2], col:PAL[a[3]], ice:(a[4]&&a[4].ice)||0, iceMax:(a[4]&&a[4].ice)||0,
    gift:!!(a[4]&&a[4].gift), g:0, locked:false, removed:false }));
  const links = L.links.map(([o,h]) => {
    const A = rings[o], B = rings[h];
    return { owner:o, host:h, angle: Math.atan2(A.y-B.y, A.x-B.x)*180/Math.PI, released:false };
  });
  // 缺口方向：離所有卡榫/支架最遠的角度
  rings.forEach(R => {
    const angs = links.filter(l => l.host===R.id).map(l => l.angle)
      .concat(links.filter(l => l.owner===R.id).map(l => { const H = rings[l.host]; return Math.atan2(H.y-R.y, H.x-R.x)*180/Math.PI; }));
    let best = -90, bestD = -1;
    for (let a = -90; a < 270; a += 5){
      const d = angs.length ? Math.min(...angs.map(x => angDist(a,x))) : 180;
      if (d > bestD + 0.01){ bestD = d; best = a; }
    }
    R.g = best;
  });
  rings.forEach(R => R.locked = links.some(l => l.owner===R.id));
  // 表情位置：放在圓環身上、離缺口和卡榫最遠、偏上方的地方
  rings.forEach(R => {
    const angs = links.filter(l => l.host===R.id).map(l => l.angle)
      .concat(links.filter(l => l.owner===R.id).map(l => { const H = rings[l.host]; return Math.atan2(H.y-R.y, H.x-R.x)*180/Math.PI; }));
    let best = 180, bestScore = -1e9;
    for (let off = GH+30; off <= 360-GH-30; off += 5){
      const a = R.g + off;
      const d = angs.length ? Math.min(...angs.map(x => angDist(a,x))) : 180;
      const score = Math.min(d, 60) - angDist(a, -90)*0.12;
      if (score > bestScore){ bestScore = score; best = off; }
    }
    R.faceOff = best;
  });
  // 最佳步數 & 炸彈倒數
  const par = rings.reduce((s,R) => s + costOfRing(R, links), 0);
  S = { idx, rings, links, moves:0, par, busy:false, over:false, hintEl:null };
  render();
  updateHUD();
}

  el('feDropShadow', {dx:0, dy:4, stdDeviation:2, 'flood-color':'#8a5a2b', 'flood-opacity':0.22}, f);

  [[0,'#59626c'],[0.18,'#9aa4ae'],[0.42,'#eef2f6'],[0.6,'#c3cbd3'],[0.85,'#8a949e'],[1,'#525a63']].forEach(([o,c]) => el('stop', {offset:o, 'stop-color':c}, cg));

    el('path', {d, fill:'none', stroke:R.col[0], 'stroke-width':SW, 'stroke-linecap':'round'}, rot);

    el('path', {d:arcPath(R.r-4), fill:'none', stroke:'#fff', 'stroke-opacity':0.55, 'stroke-width':4, 'stroke-linecap':'round', 'stroke-dasharray':`${R.r*1.4} ${R.r*0.5} 3 ${R.r*9}`}, rot);

// 連接棒：手銬（在自己的座標系中，0 端套住自己的圓環，len 端套住別人的圓環）
const CUFF = 15;   // 手銬環的半長（要大於圓環粗細的一半，才看得出套住）
function drawLink(l, len){
  const g = l.el; g.innerHTML = '';
  if (len < 2) return;
  const O = '#3e454d', M = '#a9b2bc', H = '#eef2f6';
  // 鐵鍊
  const start = CUFF + 6, end = len - CUFF - 6;
  if (end > start){
    const n = Math.max(1, Math.round((end - start) / 7.5)), step = (end - start) / n;
    for (let i = 0; i <= n; i++){
      const x = start + i*step;
      if (i % 2 === 0){
        el('ellipse', {cx:x, cy:0, rx:5.2, ry:3.6, fill:'none', stroke:O, 'stroke-width':4.2}, g);
        el('ellipse', {cx:x, cy:0, rx:5.2, ry:3.6, fill:'none', stroke:M, 'stroke-width':2}, g);
        el('path', {d:`M ${x-3} -2.4 Q ${x} -3.6 ${x+3} -2.4`, fill:'none', stroke:H, 'stroke-width':1}, g);
      } else {
        el('line', {x1:x-5, y1:0, x2:x+5, y2:0, stroke:O, 'stroke-width':4.6, 'stroke-linecap':'round'}, g);
        el('line', {x1:x-5, y1:0, x2:x+5, y2:0, stroke:M, 'stroke-width':2.2, 'stroke-linecap':'round'}, g);
      }
    }
  }
  // 手銬環：斜斜的金屬圈，後半圈畫在圓環「下面」、前半圈畫在「上面」，看起來真的套住
  const bk = l.back; bk.innerHTML = '';
  const RY = 8;
  const arc = (parent, x, front) => {
    const d = `M ${x-CUFF} 0 A ${CUFF} ${RY} 0 0 ${front?0:1} ${x+CUFF} 0`;
    el('path', {d, fill:'none', stroke:O, 'stroke-width':8, 'stroke-linecap':'round'}, parent);
    el('path', {d, fill:'none', stroke: front ? M : '#7d8691', 'stroke-width':4.4, 'stroke-linecap':'round'}, parent);
    if (front) el('path', {d:`M ${x-CUFF*0.6} ${RY*0.72} A ${CUFF} ${RY} 0 0 0 ${x+CUFF*0.35} ${RY*0.9}`, fill:'none', stroke:H, 'stroke-width':1.4, 'stroke-linecap':'round'}, parent);
  };
  const cuff = (x, toward) => {
    arc(bk, x, false);           // 後半圈（被圓環蓋住）
    arc(g, x, true);             // 前半圈（蓋在圓環上）
    // 鎖扣小盒
    el('rect', {x:x-4.5, y:RY-4, width:9, height:7.5, rx:2, fill:M, stroke:O, 'stroke-width':1.8}, g);
    el('circle', {cx:x, cy:RY-0.3, r:1.2, fill:O}, g);
    // 接鐵鍊的小環
    const ex = x + toward*(CUFF + 2.5);
    el('circle', {cx:ex, cy:0, r:3.4, fill:'none', stroke:O, 'stroke-width':3.6}, g);
    el('circle', {cx:ex, cy:0, r:3.4, fill:'none', stroke:M, 'stroke-width':1.6}, g);
  };
  if (len > CUFF*2 + 4) cuff(0, 1);
  cuff(len, -1);
}

  const hasItem = R.gift;
  if (R.ice > 0){
    const ice = el('g', {opacity: 0.5 + 0.4*(R.ice/R.iceMax)}, c);
    el('circle', {r:R.r, fill:'none', stroke:'#e6f7ff', 'stroke-width':SW+14, opacity:0.85}, ice);
    el('circle', {r:R.r+8, fill:'none', stroke:'#a9dcf5', 'stroke-width':1.5, opacity:0.9}, ice);
    el('circle', {r:R.r-8, fill:'none', stroke:'#a9dcf5', 'stroke-width':1.5, opacity:0.9}, ice);
    for (let i=0;i<8;i++){
      const a = i*45+10, ca = Math.cos(a*Math.PI/180), sa = Math.sin(a*Math.PI/180), rr = R.r + (i%2?4:-4);
      el('path', {d:`M ${rr*ca-3} ${rr*sa} h 6 M ${rr*ca} ${rr*sa-3} v 6`, stroke:'#fff', 'stroke-width':1.8, 'stroke-linecap':'round'}, ice);
    }
    const t = el('text', {x:0, y: hasItem ? -R.r*0.42 : (R.locked ? R.r*0.66 : 6), 'text-anchor':'middle', 'font-size':16, 'font-weight':900, fill:'#3a98d0', stroke:'#fff', 'stroke-width':3, 'paint-order':'stroke'}, c);
    t.textContent = '❄' + R.ice;
  }
  if (R.gift){
    const g = el('g', {}, c);
    el('rect', {x:-13, y:-7, width:26, height:20, rx:4, fill:'#ff7d95', stroke:'#c94a66', 'stroke-width':2}, g);
    el('rect', {x:-15, y:-13, width:30, height:8, rx:3, fill:'#ff9bb0', stroke:'#c94a66', 'stroke-width':2}, g);
    el('rect', {x:-3, y:-13, width:6, height:26, fill:'#ffd84a'}, g);
    el('path', {d:'M 0 -13 C -10 -24 -16 -14 0 -13 C 16 -14 10 -24 0 -13', fill:'#ffd84a', stroke:'#c99a10', 'stroke-width':1.5}, g);
  }
  if (R.locked){
    if (hasItem) lockIcon(c, 0, R.r*0.55, 0.75); else lockIcon(c, 0, R.ice>0 ? -4 : 0, 1);
  }
}

function updateHUD(){
  $('levelBtn').innerHTML = `<span class="lvl-k">第</span> ${S.idx+1} <span class="lvl-k">/ ${LEVELS.length} 關</span>`;
}

// ---------- 動畫 ----------
function animate(ms, fn){
  return new Promise(res => {
    const t0 = performance.now();
    const step = now => {
      const p = Math.max(0, Math.min(1, (now-t0)/ms));
      fn(p);
      if (p < 1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
}
const ease = p => 1 - Math.pow(1-p, 3);

function releaseLink(l){
  l.released = true; SFX.pop();
  animate(320, p => {
    drawLink(l, l.L * (1 - ease(p)));
    l.el.setAttribute('opacity', 1-p); l.back.setAttribute('opacity', 1-p);
  }).then(() => { l.el.remove(); l.back.remove(); });
}

async function rotateRing(R, dir){
  const g0 = R.g, g1 = g0 + dir*STEP; let prev = g0;
  SFX.turn();
  await animate(ROT_MS, p => {
    const cur = g0 + (g1-g0)*ease(p);
    R.el.rot.setAttribute('transform', `rotate(${cur})`);
    S.links.forEach(l => { if (!l.released && l.host===R.id && swept(prev, cur, l.angle)) releaseLink(l); });
    prev = cur;
  });
  R.g = g1;
}

async function removeRing(R){
  R.removed = true;
  if (R.gift){ S.moves = Math.max(0, S.moves-2); floatText(R.x, R.y-10, '🎁 步數 −2', '#ff5d73'); SFX.gift(); }
  else SFX.free();
  const o = R.el.outer; o.style.pointerEvents = 'none';
  await animate(420, p => {
    const s = 1 + 0.25*p;
    o.setAttribute('transform', `translate(${R.x} ${R.y - 40*p}) scale(${s})`);
    o.setAttribute('opacity', 1-p);
  });
  o.remove();
}

function floatText(x, y, txt, color){
  const t = el('text', {x, y, 'text-anchor':'middle', 'font-size':22, 'font-weight':900, fill:color, stroke:'#fff', 'stroke-width':4, 'paint-order':'stroke'}, S.topLayer);
  t.textContent = txt;
  animate(1100, p => { t.setAttribute('y', y - 50*p); t.setAttribute('opacity', p<0.6?1:1-(p-0.6)/0.4); }).then(() => t.remove());
}

async function shake(R){
  SFX.lock();
  await animate(300, p => {
    const dx = Math.sin(p*Math.PI*6)*6*(1-p);
    R.el.outer.setAttribute('transform', `translate(${R.x+dx} ${R.y})`);
  });
}

// ---------- 遊戲邏輯 ----------
async function settle(){
  let changed = true;
  const removals = [];
  S.rings.forEach(R => {
    if (R.removed) return;
    const wasLocked = R.locked;
    R.locked = S.links.some(l => !l.released && l.owner===R.id);
    if (wasLocked !== R.locked) drawCenter(R);
  });
  S.rings.forEach(R => {
    if (R.removed || R.locked) return;
    if (!S.links.some(l => !l.released && l.host===R.id)) removals.push(R);
  });
  if (removals.length) await Promise.all(removals.map(removeRing));
  updateHUD();
  if (S.rings.every(R => R.removed)) return win();
}

function spendMove(){
  S.moves++;
  updateHUD();
}

async function act(R, dir){
  if (S.busy || S.over || R.removed) return;
  clearHint();
  S.busy = true;
  try{
    if (R.ice > 0){
      spendMove(); R.ice--; SFX.ice();
      drawCenter(R);
      await animate(160, p => R.el.outer.setAttribute('transform', `translate(${R.x} ${R.y}) scale(${1+0.06*Math.sin(p*Math.PI)})`));
      if (R.ice === 0) floatText(R.x, R.y, '冰碎了！', '#3aa0d8');
    } else if (R.locked){
      await shake(R);
    } else {
      spendMove();
      await rotateRing(R, dir);
    }
    await settle();
  } finally { S.busy = false; }
}

function pickRing(px, py){
  let best = null, bestScore = Infinity;
  S.rings.forEach(R => {
    if (R.removed) return;
    const d = Math.hypot(px-R.x, py-R.y);
    if (d <= R.r + 16){ const sc = d/R.r; if (sc < bestScore){ bestScore = sc; best = R; } }
  });
  return best;
}

svg.addEventListener('pointerdown', e => {
  if (!S || S.busy || S.over) return;
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const R = pickRing(p.x, p.y);
  if (!R) return;
  act(R, p.x < R.x ? -1 : 1);
});

// ---------- 提示 ----------
function nextHint(){
  const live = S.rings.filter(R => !R.removed);
  const hosted = R => S.links.filter(l => !l.released && l.host===R.id).map(l => l.angle);
  const useful = R => hosted(R).length > 0;
  const pri = R => -hosted(R).length;
  // 可以轉的環（含要先敲冰的）
  let cands = live.filter(R => !R.locked && useful(R)).sort((a,b) => pri(a)-pri(b));
  if (cands.length){
    const R = cands[0];
    if (R.ice > 0) return {R, dir:0};
    return {R, dir: planRotation(R.g, hosted(R))[0]};
  }
  const iced = live.filter(R => R.ice > 0).sort((a,b) => pri(a)-pri(b));
  if (iced.length) return {R:iced[0], dir:0};
  return null;
}
function clearHint(){ if (S && S.hintEl){ S.hintEl.remove(); S.hintEl = null; } }
function showHint(){
  if (!S || S.busy || S.over) return;
  clearHint();
  const h = nextHint(); if (!h) return;
  const {R, dir} = h;
  const g = el('g', {'pointer-events':'none'}, S.topLayer);
  const c = el('circle', {cx:R.x, cy:R.y, r:R.r+14, fill:'none', stroke:'#ffb300', 'stroke-width':5, 'stroke-dasharray':'10 8'}, g);
  el('animate', {attributeName:'stroke-dashoffset', values:'0;36', dur:'1s', repeatCount:'indefinite'}, c);
  const label = R.ice > 0 ? '👆 敲冰' : (dir > 0 ? '👆 點右邊 ↻' : '👆 點左邊 ↺');
  const t = el('text', {x:R.x, y:R.y - R.r - 22, 'text-anchor':'middle', 'font-size':17, 'font-weight':900, fill:'#8a5a2b', stroke:'#fff', 'stroke-width':5, 'paint-order':'stroke'}, g);
  t.textContent = label;
  S.hintEl = g;
}

// ---------- 過關 / 失敗 ----------
function starsFor(){ return S.moves <= S.par ? 3 : S.moves <= S.par + 3 ? 2 : 1; }
function starHTML(n){ return [0,1,2].map(i => `<span class="${i<n?'':'off'}">⭐</span>`).join(''); }
function win(){
  S.over = true; SFX.win(); confetti();
  const st = starsFor();
  const prev = progress.stars[S.idx] || 0;
  progress.stars[S.idx] = Math.max(prev, st);
  store.set('rings_progress', progress);
  setTimeout(() => {
    if (S.idx === LEVELS.length-1){
      const total = Object.values(progress.stars).reduce((a,b)=>a+b,0);
      $('endStars').innerHTML = starHTML(st);
      $('endText').innerHTML = `你是解圓環大師！<br>總共拿到 ${total} / ${LEVELS.length*3} 顆星`;
      $('endOv').classList.add('show');
      return;
    }
    $('winStars').innerHTML = starHTML(st);
    $('winText').innerHTML = `用了 ${S.moves} 步` + (st < 3 ? `（${S.par} 步內可拿 3 顆星）` : '，太厲害了！');
    $('winOv').classList.add('show');
  }, 500);
}
function confetti(){
  const cols = ['#ffd84a','#ee6fae','#5ab4ea','#7ccb52','#9b6ee8','#f59a3e'];
  for (let i=0;i<60;i++){
    const d = document.createElement('div'); d.className = 'confetti';
    d.style.left = Math.random()*100 + 'vw'; d.style.background = cols[i%cols.length];
    d.style.animationDuration = (1.6 + Math.random()*1.6) + 's'; d.style.animationDelay = Math.random()*0.4 + 's';
    document.body.appendChild(d); setTimeout(() => d.remove(), 3800);
  }
}

// ---------- 選單 ----------
function maxUnlocked(){ let m = 0; while (m < LEVELS.length-1 && progress.stars[m]) m++; return m; }
function openMenu(){
  const grid = $('lvGrid'); grid.innerHTML = '';
  const mu = maxUnlocked();
  LEVELS.forEach((_, i) => {
    const b = document.createElement('button');
    const st = progress.stars[i] || 0;
    b.className = 'lv' + (i > mu ? ' locked' : '') + (S && S.idx===i ? ' cur' : '');
    b.innerHTML = i > mu ? '🔒' : `${i+1}<small>${'⭐'.repeat(st) || '&nbsp;'}</small>`;
    if (i <= mu) b.onclick = () => { closeAll(); loadLevel(i); };
    grid.appendChild(b);
  });
  $('menuOv').classList.add('show');
}
function closeAll(){ document.querySelectorAll('.overlay').forEach(o => o.classList.remove('show')); }

$('levelBtn').onclick = openMenu;
$('menuClose').onclick = closeAll;
$('resetBtn').onclick = () => { if (!S.busy){ closeAll(); loadLevel(S.idx); } };
$('hintBtn').onclick = showHint;
$('winRetry').onclick = () => { closeAll(); loadLevel(S.idx); };
$('winNext').onclick = () => { closeAll(); loadLevel(Math.min(S.idx+1, LEVELS.length-1)); };
$('endMenu').onclick = () => { closeAll(); openMenu(); };
const sb = $('soundBtn');
const sIcon = () => sb.innerHTML = `<span class="ic">${soundOn ? '🔊' : '🔇'}</span>`;
sIcon();
sb.onclick = () => { soundOn = !soundOn; store.set('rings_sound', soundOn); sIcon(); };

// ---------- 版面：遊戲板依可用空間等比縮放 ----------
function fitBoard(){
  const st = $('stage'), bd = $('board');
  const W = st.clientWidth, H = st.clientHeight, ratio = 400/560;
  let w = W, h = W/ratio;
  if (h > H){ h = H; w = H*ratio; }
  bd.style.width = Math.floor(w) + 'px'; bd.style.height = Math.floor(h) + 'px';
}
window.addEventListener('resize', fitBoard);
window.addEventListener('orientationchange', () => setTimeout(fitBoard, 200));
if (window.ResizeObserver) new ResizeObserver(fitBoard).observe($('stage'));
// 防止 iOS 兩指縮放（雙擊放大已由 touch-action 關閉）
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

// 測試用介面
window.__rings = { get S(){ return S; }, LEVELS, loadLevel, act, nextHint, setSpeed(ms){ ROT_MS = ms; } };

loadLevel(Math.min(maxUnlocked(), LEVELS.length-1));
fitBoard();
})();
</script>
